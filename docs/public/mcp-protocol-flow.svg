<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #38bdf8; }
    .code-bad { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #f87171; }
    .stat-pill { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="880" height="440" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left: Traditional Grep + File Reading -->
  <g transform="translate(30, 30)">
    <rect width="390" height="380" rx="12" fill="url(#cardBg)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Header -->
    <rect x="20" y="20" width="110" height="24" rx="12" fill="#7f1d1d" />
    <text x="75" y="36" class="stat-pill" text-anchor="middle">WITHOUT MCP</text>
    <text x="20" y="68" class="header">Naive Grep + Read Whole Files</text>
    <text x="20" y="86" class="sub">High token wastage, false positives &amp; slow context burn</text>

    <!-- Step 1 -->
    <g transform="translate(20, 110)">
      <rect width="350" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" class="code-bad">$ grep -rn "DemandService" src/</text>
      <text x="12" y="38" class="sub">240+ raw string hits (comments, imports, types)</text>
    </g>

    <!-- Arrow -->
    <path d="M195 168 L195 186" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Step 2 -->
    <g transform="translate(20, 196)">
      <rect width="350" height="74" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" class="code-bad">Agent reads 15-30 entire files</text>
      <text x="12" y="40" class="sub">Wastes model context reading irrelevant method bodies,</text>
      <text x="12" y="58" class="sub">unrelated helpers, and large boilerplate files.</text>
    </g>

    <!-- Result Banner -->
    <g transform="translate(20, 290)">
      <rect width="350" height="70" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="1.5" />
      <text x="20" y="28" font-family="sans-serif" font-size="20" font-weight="700" fill="#fca5a5">4,500 - 8,000 Tokens</text>
      <text x="20" y="50" class="sub" fill="#fecaca">2-5 seconds latency • High risk of hallucinated calls</text>
    </g>
  </g>

  <!-- Right: Codebrain MCP Local Server -->
  <g transform="translate(460, 30)">
    <rect width="390" height="380" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Header -->
    <rect x="20" y="20" width="130" height="24" rx="12" fill="#065f46" />
    <text x="85" y="36" class="stat-pill" text-anchor="middle">WITH CODEBRAIN</text>
    <text x="20" y="68" class="header">Structural Code Intelligence</text>
    <text x="20" y="86" class="sub">Deterministic SQLite lookups &amp; precise AST symbols</text>

    <!-- Step 1 -->
    <g transform="translate(20, 110)">
      <rect width="350" height="48" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="12" y="22" class="code">call_tool("find_references", { id: "..." })</text>
      <text x="12" y="38" class="sub">Structured query in ~0.05ms directly over stdio</text>
    </g>

    <!-- Arrow -->
    <path d="M195 168 L195 186" stroke="#10b981" stroke-width="2" />

    <!-- Step 2 -->
    <g transform="translate(20, 196)">
      <rect width="350" height="74" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="12" y="22" class="code">Exact Symbol Context Returned</text>
      <text x="12" y="40" class="sub">Only exact callers, signatures, and locations.</text>
      <text x="12" y="58" class="sub">Zero unnecessary file reads. 100% precision.</text>
    </g>

    <!-- Result Banner -->
    <g transform="translate(20, 290)">
      <rect width="350" height="70" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
      <text x="20" y="28" font-family="sans-serif" font-size="20" font-weight="700" fill="#6ee7b7">150 - 400 Tokens (95% ↓)</text>
      <text x="20" y="50" class="sub" fill="#a7f3d0">150-400ms round-trip • 12x faster execution</text>
    </g>
  </g>
</svg>
