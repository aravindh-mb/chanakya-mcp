<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f141f" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0c1e33" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#062e24" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="resGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulsePacket {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 0.9; transform: scale(1.02); }
    }

    @keyframes dbRowInsert {
      0%, 100% { fill: #1e293b; }
      50% { fill: #0369a1; }
    }

    @keyframes liveSignal {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .flow-path {
      stroke: #38bdf8;
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: flowLine 1.5s linear infinite;
      fill: none;
    }

    .flow-path-green {
      stroke: #10b981;
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: flowLine 1.5s linear infinite;
      fill: none;
    }

    .flow-path-purple {
      stroke: #c084fc;
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: flowLine 1.5s linear infinite;
      fill: none;
    }

    .title-text { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #f8fafc; }
    .subtitle-text { font-family: -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
    .card-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
    .card-sub { font-family: -apple-system, sans-serif; font-size: 10.5px; fill: #94a3b8; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #38bdf8; }
    .code-green { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #34d399; }
    .code-purple { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #c084fc; }
    .code-amber { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #fbbf24; }
    .badge-txt { font-family: -apple-system, sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; }

    .pulse-bead-1 {
      offset-path: path('M 230 145 L 340 145');
      animation: pulsePacket 2s infinite ease-in-out;
    }
    .pulse-bead-2 {
      offset-path: path('M 490 200 L 490 245');
      animation: pulsePacket 2s infinite ease-in-out 0.4s;
    }
    .pulse-bead-3 {
      offset-path: path('M 490 355 L 490 395');
      animation: pulsePacket 2s infinite ease-in-out 0.8s;
    }
    .pulse-bead-4 {
      offset-path: path('M 640 460 L 730 460 L 730 220');
      animation: pulsePacket 2.5s infinite ease-in-out 1.2s;
    }
    .pulse-bead-5 {
      offset-path: path('M 730 115 L 730 75 L 140 75 L 140 100');
      animation: pulsePacket 3s infinite ease-in-out 1.6s;
    }

    .sql-row-anim {
      animation: dbRowInsert 3s infinite ease-in-out;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="560" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(30, 25)">
    <rect width="180" height="22" rx="11" fill="rgba(2, 132, 199, 0.2)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="12" cy="11" r="4" fill="#38bdf8" />
    <text x="24" y="15" class="badge-txt" fill="#38bdf8">END-TO-END EXECUTION FLOW</text>
    <text x="0" y="44" class="title-text">How Chanakya MCP Operates: Tool Call ➔ SQLite ➔ 360° Context</text>
  </g>

  <!-- ============================================================== -->
  <!-- NODE 1: AI Agent (Claude Code / Cursor / Windsurf) -->
  <!-- ============================================================== -->
  <g transform="translate(30, 95)">
    <rect width="200" height="120" rx="14" fill="url(#agentGrad)" stroke="#6366f1" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Top badge -->
    <rect x="12" y="12" width="70" height="18" rx="9" fill="#4338ca" />
    <text x="47" y="24" class="badge-txt" text-anchor="middle">AI AGENT</text>
    
    <text x="12" y="48" class="card-title">Claude / Cursor</text>
    <text x="12" y="64" class="card-sub">Needs symbol context</text>

    <!-- Stdio In Box -->
    <rect x="10" y="74" width="180" height="34" rx="6" fill="#090d16" stroke="#312e81" stroke-width="1" />
    <text x="18" y="88" class="code-purple">get_symbol_context(</text>
    <text x="26" y="100" class="code-purple">"UserService.auth")</text>
  </g>

  <!-- Connecting Path 1: Agent -> MCP Server (stdin) -->
  <path d="M 230 145 L 340 145" class="flow-path" />
  <circle r="5" fill="#38bdf8" class="pulse-bead-1" filter="url(#glowCyan)" />
  <text x="285" y="135" class="code-text" text-anchor="middle" font-size="9">stdio (stdin)</text>

  <!-- ============================================================== -->
  <!-- NODE 2: MCP Stdio Server & Router -->
  <!-- ============================================================== -->
  <g transform="translate(340, 95)">
    <rect width="300" height="105" rx="14" fill="url(#mcpGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <rect x="12" y="12" width="125" height="18" rx="9" fill="#0369a1" />
    <text x="74" y="24" class="badge-txt" text-anchor="middle">MCP PROTOCOL LAYER</text>

    <text x="12" y="48" class="card-title">Chanakya MCP Stdio Router</text>
    <text x="12" y="64" class="card-sub">Zod JSON-Schema Validation &amp; Tool Dispatch</text>

    <rect x="10" y="72" width="280" height="24" rx="6" fill="#090d16" stroke="#075985" stroke-width="1" />
    <text x="18" y="88" class="code-text">✓ validated tool: "get_symbol_context" (&lt;0.01ms)</text>
  </g>

  <!-- Connecting Path 2: MCP -> Parser -->
  <path d="M 490 200 L 490 245" class="flow-path-green" />
  <circle r="5" fill="#10b981" class="pulse-bead-2" filter="url(#glowGreen)" />
  <text x="502" y="226" class="code-green" font-size="9">parse &amp; extract</text>

  <!-- ============================================================== -->
  <!-- NODE 3: Tree-Sitter Parser & AST Extraction Pipeline -->
  <!-- ============================================================== -->
  <g transform="translate(340, 245)">
    <rect width="300" height="110" rx="14" fill="url(#treeGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <rect x="12" y="12" width="140" height="18" rx="9" fill="#065f46" />
    <text x="82" y="24" class="badge-txt" text-anchor="middle">TREE-SITTER AST ENGINE</text>

    <text x="12" y="48" class="card-title">Concrete Syntax Tree (CST) Walker</text>
    <text x="12" y="64" class="card-sub">Extracts Symbols, Call Invocations &amp; Containment</text>

    <rect x="10" y="72" width="280" height="28" rx="6" fill="#062e24" stroke="#059669" stroke-width="1" />
    <text x="18" y="85" class="code-green">Tree: program ➔ class ➔ method(auth)</text>
    <text x="18" y="96" class="code-green">Calls: verifyHash(pwd) [resolved: crypto.ts]</text>
  </g>

  <!-- Connecting Path 3: Parser -> SQLite Store -->
  <path d="M 490 355 L 490 395" class="flow-path" />
  <circle r="5" fill="#38bdf8" class="pulse-bead-3" filter="url(#glowCyan)" />
  <text x="502" y="380" class="code-text" font-size="9">BEGIN TX (20ms)</text>

  <!-- ============================================================== -->
  <!-- NODE 4: SQLite Database Store & String Interning -->
  <!-- ============================================================== -->
  <g transform="translate(40, 395)">
    <rect width="600" height="135" rx="14" fill="url(#dbGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Header -->
    <rect x="14" y="12" width="165" height="18" rx="9" fill="#075985" />
    <text x="96" y="24" class="badge-txt" text-anchor="middle">RELATIONAL SQLITE ENGINE</text>
    <text x="190" y="25" class="code-text" font-size="10">.chanakya/index.db (WAL Mode, Schema v4)</text>

    <!-- 4 Tables Overview -->
    <g transform="translate(14, 38)">
      <!-- Table 1: symbols -->
      <rect width="135" height="50" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" class="sql-row-anim" />
      <text x="8" y="16" class="code-amber" font-weight="700">TABLE: symbols</text>
      <text x="8" y="30" class="code-text">key | name | kind</text>
      <text x="8" y="42" class="code-text">104 | auth | method</text>

      <!-- Table 2: relationships -->
      <rect x="145" width="135" height="50" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="153" y="16" class="code-purple" font-weight="700">relationships</text>
      <text x="153" y="30" class="code-text">from: 104 ➔ to: 89</text>
      <text x="153" y="42" class="code-text">kind: calls (resolved)</text>

      <!-- Table 3: references (interned) -->
      <rect x="290" width="135" height="50" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="298" y="16" class="code-green" font-weight="700">reference_names</text>
      <text x="298" y="30" class="code-text">512 ➔ "authenticate"</text>
      <text x="298" y="42" class="code-green">75% space interned</text>

      <!-- Table 4: files -->
      <rect x="435" width="135" height="50" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="443" y="16" class="code-text" font-weight="700">TABLE: files</text>
      <text x="443" y="30" class="code-text">file_id: 12 (auth.ts)</text>
      <text x="443" y="42" class="code-text">hash: sha256 (2-stage)</text>
    </g>

    <!-- B-Tree indexes bar -->
    <rect x="14" y="96" width="570" height="26" rx="6" fill="#090d16" stroke="#334155" stroke-width="1" />
    <text x="24" y="113" class="code-amber">⚡ B-Tree Indexes Hot in Memory:</text>
    <text x="210" y="113" class="code-text">idx_symbols_name &bull; idx_rel_from &bull; idx_rel_to &bull; idx_refs_name (~0.03ms lookup)</text>
  </g>

  <!-- Connecting Path 4: SQLite -> Response Context -->
  <path d="M 640 460 L 730 460 L 730 220" class="flow-path-green" />
  <circle r="5" fill="#10b981" class="pulse-bead-4" filter="url(#glowGreen)" />
  <text x="695" y="450" class="code-green" font-size="9">SQL Query</text>

  <!-- ============================================================== -->
  <!-- NODE 5: 360° Context Delivery & JSON-RPC Response -->
  <!-- ============================================================== -->
  <g transform="translate(680, 95)">
    <rect width="250" height="120" rx="14" fill="url(#resGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <rect x="12" y="12" width="125" height="18" rx="9" fill="#047857" />
    <text x="74" y="24" class="badge-txt" text-anchor="middle">360° CONTEXT ENGINE</text>

    <text x="12" y="48" class="card-title">Synthesized Context</text>
    <text x="12" y="64" class="code-green">Query Latency: ~0.04 ms</text>

    <rect x="10" y="72" width="230" height="38" rx="6" fill="#022c22" stroke="#059669" stroke-width="1" />
    <text x="16" y="86" class="code-green">180 tokens returned (96% ↓)</text>
    <text x="16" y="98" class="card-sub" fill="#6ee7b7">0 hallucinations &bull; exact AST lines</text>
  </g>

  <!-- Connecting Path 5: Return to Agent (stdout) -->
  <path d="M 730 95 L 730 65 L 140 65 L 140 95" class="flow-path-green" />
  <circle r="5" fill="#34d399" class="pulse-bead-5" filter="url(#glowGreen)" />
  <text x="440" y="58" class="code-green" text-anchor="middle" font-size="9.5">JSON-RPC Response via stdio (stdout) ➔ AI Agent</text>
</svg>
